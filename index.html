<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsible Generative AI Basics — Course Hub</title>
<meta http-equiv="refresh" content="0; url=labs/">
<link rel="canonical" href="labs/">
<style>
  :root { --bg:#0f1420; --card:#161c2b; --text:#e8ecf4; --muted:#9aa6bd; --accent:#4a9eff; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:Georgia,'Times New Roman',serif; padding:2rem;
  }
  .card {
    background:var(--card); border-radius:10px; padding:2.5rem 3rem;
    max-width:34rem; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  h1 { margin:0 0 .75rem; font-size:1.6rem; line-height:1.3; }
  p { color:var(--muted); margin:0 0 1.5rem; line-height:1.6; }
  a.btn {
    display:inline-block; background:var(--accent); color:#08101d; text-decoration:none;
    padding:.7rem 1.6rem; border-radius:10px; font-weight:bold;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.btn:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(74,158,255,.35); }
  .code { color:var(--muted); font-size:.85rem; margin-top:1.5rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Responsible Generative AI Basics</h1>
    <p>Redirecting you to the course activity hub&hellip;</p>
    <a class="btn" href="labs/">Open the Course Hub</a>
    <div class="code">WSQ Course Code: TGS-2025060472<br>Tertiary Infotech Academy Pte Ltd</div>
  </div>
</body>
</html>
